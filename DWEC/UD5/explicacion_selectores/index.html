<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Introducción al DOM - Selectores</title>
    <link rel="stylesheet" href="css/estilos.css">
    <script src="js/script.js" defer></script>
</head>
<body>
    <h1 id="titulo">Introducción al DOM</h1>

    <p id="presentacion">Vamos a aprender a seleccionar elementos de una página.</p>
    <p class="mensaje">Primer mensaje.</p>
    <p class="mensaje">Segundo mensaje.</p>
    <p>Este párrafo no tiene id ni class.</p>

    <div id="grupo">
        <p class="mensaje">Párrafo dentro de un div.</p>
    </div>

    <label for="nombre">Nombre:</label>
    <input type="text" id="nombre" name="alumno" value="Ana">
</body>
</html>
