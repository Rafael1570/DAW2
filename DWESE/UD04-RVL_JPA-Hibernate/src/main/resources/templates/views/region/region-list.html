<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" th:replace="~{index :: layout(#{msg.region-list.title}, ~{::main})}">
<body>
<main class="list-page">
<div class="list-card">
  <h1  th:text="#{msg.region-list.title}">Comunidades Autónomas</h1>
  <a class="btn btn-success" th:href="@{/regions/new}" th:text="#{msg.region-list.add}">Agregar nueva Comunidad Autónoma</a>
  <div th:if="${errorMessage}" class="alert alert-danger" role="alert" th:text="${errorMessage}"></div>
  <div class="table-responsive">
    <table class="table table-striped table-bordered">
      <thead><tr><th th:attr="aria-sort=${sortField == 'id' ? (sortDir == 'asc' ? 'ascending' : 'descending') : 'none'}"><a th:href="@{/regions(page=0,size=${pageSize},sortField='id',sortDir=${sortField == 'id' ? reverseSortDir : 'asc'})}"><span th:text="#{msg.region-list.id}"></span><span th:if="${sortField == 'id'}" th:text="${sortDir == 'asc' ? ' ▲' : ' ▼'}"></span></a></th><th th:attr="aria-sort=${sortField == 'code' ? (sortDir == 'asc' ? 'ascending' : 'descending') : 'none'}"><a th:href="@{/regions(page=0,size=${pageSize},sortField='code',sortDir=${sortField == 'code' ? reverseSortDir : 'asc'})}"><span th:text="#{msg.region-list.code}"></span><span th:if="${sortField == 'code'}" th:text="${sortDir == 'asc' ? ' ▲' : ' ▼'}"></span></a></th><th th:attr="aria-sort=${sortField == 'name' ? (sortDir == 'asc' ? 'ascending' : 'descending') : 'none'}"><a th:href="@{/regions(page=0,size=${pageSize},sortField='name',sortDir=${sortField == 'name' ? reverseSortDir : 'asc'})}"><span th:text="#{msg.region-list.name}"></span><span th:if="${sortField == 'name'}" th:text="${sortDir == 'asc' ? ' ▲' : ' ▼'}"></span></a></th><th  th:text="#{msg.region-list.actions}">Acciones</th></tr></thead>
      <tbody><tr th:each="region : ${regions}">
        <td th:text="${region.id}"></td><td><span th:text="${region.code}"></span></td><td  th:text="${region.name}"></td>
        <td >
          <a class="btn btn-detail btn-sm" th:href="@{/regions/detail(id=${region.id})}" th:text="#{msg.region-list.viewDetail}">Ver detalle</a>
          <a class="btn btn-primary btn-sm" th:href="@{/regions/edit(id=${region.id})}" th:text="#{msg.region-list.edit}">Editar</a>
          <form class="d-inline" method="post" th:action="@{/regions/delete}" th:data-confirm="#{msg.region-list.confirm}">
            <input type="hidden" name="id" th:value="${region.id}"><button class="btn btn-danger btn-sm" type="submit" th:text="#{msg.region-list.delete}">Eliminar</button>
          </form>
        </td>
      </tr><tr th:if="${#lists.isEmpty(regions)}"><td colspan="4" class="text-center text-secondary py-5" th:text="#{msg.common.empty}">No hay datos.</td></tr></tbody>
    </table>
  </div>
  <div class="d-flex flex-wrap gap-3 align-items-center justify-content-between mt-3">
    <span th:text="#{msg.pagination.info(${currentPage + (totalPages > 0 ? 1 : 0)}, ${totalPages}, ${totalElements})}"></span>
    <nav th:if="${totalPages > 0}" th:aria-label="#{msg.pagination.aria.label}">
      <ul class="pagination mb-0">
        <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled'">
          <a class="page-link" th:href="${currentPage > 0} ? @{/regions(page=${currentPage - 1},size=${pageSize},sortField=${sortField},sortDir=${sortDir})} : null" th:attr="aria-disabled=${currentPage == 0}" th:aria-label="#{msg.pagination.prev}">&laquo;</a>
        </li>
        <li class="page-item" th:each="i : ${#numbers.sequence(0,totalPages - 1)}" th:classappend="${i == currentPage} ? 'active'">
          <a class="page-link" th:href="@{/regions(page=${i},size=${pageSize},sortField=${sortField},sortDir=${sortDir})}" th:text="${i + 1}" th:attr="aria-current=${i == currentPage ? 'page' : null}"></a>
        </li>
        <li class="page-item" th:classappend="${currentPage == totalPages - 1} ? 'disabled'">
          <a class="page-link" th:href="${currentPage < totalPages - 1} ? @{/regions(page=${currentPage + 1},size=${pageSize},sortField=${sortField},sortDir=${sortDir})} : null" th:attr="aria-disabled=${currentPage == totalPages - 1}" th:aria-label="#{msg.pagination.next}">&raquo;</a>
        </li>
      </ul>
    </nav>
  </div>
  <a class="btn btn-secondary" th:href="@{/}" th:text="#{msg.nav.home}">Inicio</a>
</div>
</main>
</body>
</html>
