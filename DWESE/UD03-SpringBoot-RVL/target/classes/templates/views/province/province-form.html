<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
<head th:replace="~{fragments/head :: head(${editing} ? #{province.form.edit} : #{province.form.add})}"></head>
<body class="d-flex flex-column min-vh-100">
<header th:replace="~{fragments/header :: header}"></header>
<main class="container flex-grow-1 py-5">
  <div class="eyebrow">Rafael Vega Librero · UD03-5</div>
  <h1 class="mb-4" th:text="${editing} ? #{province.form.edit} : #{province.form.add}">Provincia</h1>
  <form class="form-card" th:object="${province}" method="post" th:action="${editing} ? @{/provinces/update} : @{/provinces/insert}">
    <input type="hidden" th:field="*{id}">
    <div class="mb-3"><label class="form-label" for="code" th:text="#{common.code}">Código</label>
      <input class="form-control" th:classappend="${#fields.hasErrors('code')} ? 'is-invalid'" id="code" type="text" th:field="*{code}" maxlength="10">
      <div class="invalid-feedback" th:if="${#fields.hasErrors('code')}" th:errors="*{code}"></div></div>
    <div class="mb-3"><label class="form-label" for="name" th:text="#{common.name}">Nombre</label>
      <input class="form-control" th:classappend="${#fields.hasErrors('name')} ? 'is-invalid'" id="name" type="text" th:field="*{name}" maxlength="100">
      <div class="invalid-feedback" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div></div>
    <div class="mb-4"><label class="form-label" for="region" th:text="#{province.region}">Comunidad Autónoma</label>
      <select class="form-select" th:classappend="${#fields.hasErrors('regionSelected') or #fields.hasErrors('region.id')} ? 'is-invalid'" id="region" th:field="*{region.id}">
        <option value="" th:text="#{province.region.select}">Selecciona</option>
        <option th:each="r : ${regions}" th:value="${r.id}" th:text="${r.name}"></option>
      </select>
      <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('regionSelected')}" th:errors="*{regionSelected}"></div>
      <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('region.id')}" th:errors="*{region.id}"></div></div>
    <div class="d-flex flex-wrap gap-2"><button class="btn btn-primary" type="submit" th:text="${editing} ? #{common.update} : #{common.create}">Guardar</button>
      <a class="btn btn-outline-secondary" th:href="@{/provinces}" th:text="#{common.cancel}">Volver</a></div>
  </form>
</main>
<footer th:replace="~{fragments/footer :: footer}"></footer><div th:replace="~{fragments/scripts :: scripts}"></div>
</body></html>
