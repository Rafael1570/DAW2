services:
  mariadb:
    image: mariadb:11.4
    environment:
      MARIADB_ROOT_PASSWORD: root_password
      MARIADB_DATABASE: ticket_logger_webapp
      MARIADB_USER: ticketlogger
      MARIADB_PASSWORD: change_this_password
    ports:
      - "3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
volumes:
  mariadb_data:
