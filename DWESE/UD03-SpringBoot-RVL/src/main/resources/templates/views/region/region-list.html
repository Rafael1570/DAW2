<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
<head th:replace="~{fragments/head :: head(#{region.list.title})}"></head>
<body class="d-flex flex-column min-vh-100">
<header th:replace="~{fragments/header :: header}"></header>
<main class="container flex-grow-1 py-5">
  <div class="eyebrow">Rafael Vega Librero · UD03-3/4</div>
  <div class="d-flex justify-content-between align-items-center flex-wrap gap-3 mb-4">
    <h1 th:text="#{region.list.title}">Listado de Comunidades Autónomas</h1>
    <a class="btn btn-primary" th:href="@{/regions/new}" th:text="#{region.list.add}">Agregar</a>
  </div>
  <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>
  <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>
  <div class="table-card table-responsive">
    <table class="table table-hover align-middle mb-0">
      <thead><tr><th>ID</th><th th:text="#{common.code}">Código</th><th th:text="#{common.name}">Nombre</th><th th:text="#{common.actions}">Acciones</th></tr></thead>
      <tbody><tr th:each="region : ${regions}">
        <td th:text="${region.id}"></td><td><span class="code-badge" th:text="${region.code}"></span></td><td th:text="${region.name}"></td>
        <td class="text-nowrap">
          <a class="btn btn-sm btn-outline-primary" th:href="@{/regions/edit(id=${region.id})}" th:text="#{common.edit}">Editar</a>
          <form class="d-inline" method="post" th:action="@{/regions/delete}" onsubmit="return confirm(this.dataset.confirm)" th:attr="data-confirm=#{common.confirm}">
            <input type="hidden" name="id" th:value="${region.id}">
            <button class="btn btn-sm btn-outline-danger" type="submit" th:text="#{common.delete}">Eliminar</button>
          </form>
        </td>
      </tr></tbody>
    </table>
  </div>
</main>
<footer th:replace="~{fragments/footer :: footer}"></footer><div th:replace="~{fragments/scripts :: scripts}"></div>
</body></html>
