<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<header th:fragment="header" class="site-header">
  <nav class="navbar navbar-expand-lg container py-3">
    <a class="navbar-brand d-flex align-items-center gap-2" th:href="@{/}">
      <img th:src="@{/images/logo.svg}" width="38" height="38" alt="Ticket Logger">
      <span>Ticket Logger</span>
    </a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav"
            aria-controls="mainNav" aria-expanded="false" aria-label="Abrir menú">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="mainNav">
      <ul class="navbar-nav ms-auto align-items-lg-center gap-lg-2">
        <li class="nav-item"><a class="nav-link" th:href="@{/}" th:text="#{nav.home}">Inicio</a></li>
        <li class="nav-item"><a class="nav-link" th:href="@{/regions}" th:text="#{nav.regions}">Comunidades Autónomas</a></li>
        <li class="nav-item"><a class="nav-link" th:href="@{/provinces}" th:text="#{nav.provinces}">Provincias</a></li>
        <li class="nav-item language-links" aria-label="Idioma">
          <a th:href="@{''(lang='es')}" lang="es">ES</a>
          <span>·</span>
          <a th:href="@{''(lang='en')}" lang="en">EN</a>
        </li>
      </ul>
    </div>
  </nav>
</header>
</html>
