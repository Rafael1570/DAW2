services:
  db:
    image: mariadb:11.4
    container_name: ud02-crud-users-db
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:?Create .env with MARIADB_ROOT_PASSWORD}
      MARIADB_DATABASE: ${DB_DATABASE:?Create .env with DB_DATABASE}
      MARIADB_USER: ${DB_USER:?Create .env with DB_USER}
      MARIADB_PASSWORD: ${DB_PASSWORD:?Create .env with DB_PASSWORD}
    ports:
      - "3307:3306"
    volumes:
      - users_database:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  users_database:
