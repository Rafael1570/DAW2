<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" th:replace="~{index :: layout(${province.id == null} ? #{msg.province-form.add} : #{msg.province-form.edit}, ~{::main})}">
<body>
<main class="form-page">
<div class="form-card">
  <h1 th:text="${province.id == null} ? #{msg.province-form.add} : #{msg.province-form.edit}">Provincia</h1>
  <div th:if="${errorMessage}" class="alert alert-danger" role="alert" th:text="${errorMessage}"></div>
  <form method="post" th:object="${province}" th:action="${province.id == null} ? @{/provinces/insert} : @{/provinces/update}">
    <input type="hidden" th:field="*{id}">
    <div class="mb-3"><label for="code" class="form-label" th:text="#{msg.province-form.code}">Código</label><input id="code" class="form-control" th:classappend="${#fields.hasErrors('code')} ? 'is-invalid'" th:field="*{code}" maxlength="10" required><div class="invalid-feedback" th:if="${#fields.hasErrors('code')}" th:errors="*{code}"></div></div>
    <div class="mb-3"><label for="name" class="form-label" th:text="#{msg.province-form.name}">Nombre</label><input id="name" class="form-control" th:classappend="${#fields.hasErrors('name')} ? 'is-invalid'" th:field="*{name}" maxlength="100" required><div class="invalid-feedback" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div></div>
    <div class="mb-4"><label for="region.id" class="form-label" th:text="#{msg.province-form.region}">Comunidad Autónoma</label><select id="region.id" class="form-select" th:classappend="${#fields.hasErrors('regionSelected')} ? 'is-invalid'" th:field="*{region.id}"><option value="" th:text="#{msg.province-form.region.select}">-- Selecciona una comunidad autónoma --</option><option th:each="region : ${regions}" th:value="${region.id}" th:text="${region.name}"></option></select><div class="invalid-feedback" th:if="${#fields.hasErrors('regionSelected')}" th:errors="*{regionSelected}"></div><div class="invalid-feedback" th:if="${#fields.hasErrors('region')}" th:errors="*{region}"></div></div>
    <div><button class="btn btn-primary" type="submit" th:text="${province.id == null} ? #{msg.province-form.create} : #{msg.province-form.update}">Guardar</button><a class="btn btn-secondary" th:href="@{/provinces}" th:text="#{msg.province-form.returnback}">Volver al listado</a></div>
  </form>
</div>
</main>
</body>
</html>
