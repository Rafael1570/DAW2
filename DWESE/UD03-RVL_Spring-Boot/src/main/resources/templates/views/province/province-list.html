<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" th:replace="~{index :: layout(#{msg.province-list.title}, ~{::main})}">
<body>
<main class="list-page">
<div class="list-card">
  <h1  th:text="#{msg.province-list.title}">Listado de Provincias</h1>
  <a class="btn btn-success" th:href="@{/provinces/new}" th:text="#{msg.province-list.add}">Agregar Nueva Provincia</a>
  <div th:if="${errorMessage}" class="alert alert-danger" role="alert" th:text="${errorMessage}"></div>
  <div class="table-responsive"><table class="table table-striped table-bordered">
    <thead><tr><th th:text="#{msg.province-list.id}">ID</th><th th:text="#{msg.province-list.code}">Código</th><th th:text="#{msg.province-list.name}">Nombre</th><th th:text="#{msg.province-list.region}">Comunidad Autónoma</th><th  th:text="#{msg.province-list.actions}">Acciones</th></tr></thead>
    <tbody><tr th:each="province : ${provinces}">
      <td th:text="${province.id}"></td><td><span th:text="${province.code}"></span></td><td  th:text="${province.name}"></td><td th:text="${province.region.name}"></td>
      <td ><a class="btn btn-primary btn-sm" th:href="@{/provinces/edit(id=${province.id})}" th:text="#{msg.province-list.edit}">Editar</a>
        <form class="d-inline" method="post" th:action="@{/provinces/delete}" th:data-confirm="#{msg.province-list.confirm}"><input type="hidden" name="id" th:value="${province.id}"><button class="btn btn-danger btn-sm" type="submit" th:text="#{msg.province-list.delete}">Eliminar</button></form>
      </td>
    </tr><tr th:if="${#lists.isEmpty(provinces)}"><td colspan="5" class="text-center text-secondary py-5" th:text="#{msg.common.empty}">No hay datos.</td></tr></tbody>
  </table></div>
  <a class="btn btn-secondary" th:href="@{/}" th:text="#{msg.nav.home}">Inicio</a>
</div>
</main>
</body>
</html>
