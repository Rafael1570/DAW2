spring.application.name=ticket-logger-ud04-completo-rvl
spring.config.import=optional:file:.env[.properties]
spring.datasource.url=${DB_URL:jdbc:mariadb://localhost:3312/ticket_logger_ud04_completo}
spring.datasource.username=${DB_USER:ticketlogger}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MariaDBDialect
spring.datasource.hikari.maximum-pool-size=10
spring.messages.basename=messages
spring.messages.encoding=UTF-8
spring.thymeleaf.encoding=UTF-8
server.port=${SERVER_PORT:8084}

app.upload-root=${APP_UPLOAD_PATH:${UPLOAD_ROOT:./dwese-ticket-logger-images}}
spring.web.resources.static-locations=classpath:/static/,file:${app.upload-root}/
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=3MB
logging.level.org.springframework.jdbc.datasource.DataSourceTransactionManager=DEBUG

# Usuario de la práctica hasta incorporar autenticación.
app.profile-email=${PROFILE_EMAIL:admin@app.local}
