<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" th:replace="~{index :: layout(#{msg.roleDetail}, ~{::main})}">
<body><main class="container py-4"><h1 th:text="#{msg.roleDetail}"></h1>
<dl><dt th:text="#{msg.roleName}"></dt><dd th:text="${detail.role.name}"></dd><dt th:text="#{msg.displayName}"></dt><dd th:text="${detail.role.displayName}"></dd><dt th:text="#{msg.description}"></dt><dd th:text="${detail.role.description}"></dd></dl>
<h2 th:text="#{msg.users}"></h2><p th:if="${#lists.isEmpty(detail.users)}" th:text="#{msg.noAssignedUsers}"></p><ul><li th:each="u:${detail.users}"><a th:href="@{/users/detail(id=${u.id})}" th:text="${u.email}"></a></li></ul><a class="btn btn-secondary" th:href="@{/roles}" th:text="#{msg.back}"></a>
</main></body></html>
