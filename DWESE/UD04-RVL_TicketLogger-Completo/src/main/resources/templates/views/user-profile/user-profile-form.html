<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" th:replace="~{index :: layout(#{msg.userProfile.title}, ~{::main})}">
<body><main class="form-page"><div class="form-card">
<div th:if="${userProfileForm!=null}" class="text-center mb-3"><img th:src="${userProfileForm.profileImage!=null} ? @{${userProfileForm.profileImage}} : @{/images/avatar.svg}" alt="Avatar" class="img-thumbnail rounded-circle profile-picture"></div>
<h1 th:text="#{msg.userProfile.title}"></h1><p class="text-muted" th:text="#{msg.userProfile.subtitle}"></p>
<div th:if="${successMessage}" class="alert alert-success" role="status" th:text="${successMessage}"></div>
<div th:if="${errorMessage}" class="alert alert-danger" role="alert" th:text="${errorMessage}"></div>
<form th:if="${userProfileForm!=null}" th:action="@{/profile/update}" th:object="${userProfileForm}" method="post" enctype="multipart/form-data" class="mt-3">
<input type="hidden" th:field="*{userId}"><input type="hidden" th:field="*{profileImage}">
<div class="mb-3"><label for="email" class="form-label" th:text="#{msg.userProfile.field.email}"></label><input id="email" type="text" th:field="*{email}" class="form-control" readonly></div>
<div class="mb-3"><label for="firstName" class="form-label" th:text="#{msg.userProfile.field.firstName}"></label><input id="firstName" type="text" th:field="*{firstName}" class="form-control" maxlength="60"><div class="text-danger" th:if="${#fields.hasErrors('firstName')}" th:errors="*{firstName}"></div></div>
<div class="mb-3"><label for="lastName" class="form-label" th:text="#{msg.userProfile.field.lastName}"></label><input id="lastName" type="text" th:field="*{lastName}" class="form-control" maxlength="80"><div class="text-danger" th:if="${#fields.hasErrors('lastName')}" th:errors="*{lastName}"></div></div>
<div class="mb-3"><label for="phoneNumber" class="form-label" th:text="#{msg.userProfile.field.phoneNumber}"></label><input id="phoneNumber" type="text" th:field="*{phoneNumber}" class="form-control" maxlength="30"><div class="text-danger" th:if="${#fields.hasErrors('phoneNumber')}" th:errors="*{phoneNumber}"></div></div>
<div class="mb-3"><label for="bio" class="form-label" th:text="#{msg.userProfile.field.bio}"></label><textarea id="bio" th:field="*{bio}" class="form-control" rows="3" maxlength="500"></textarea><div class="text-danger" th:if="${#fields.hasErrors('bio')}" th:errors="*{bio}"></div></div>
<div class="mb-3"><label for="locale" class="form-label" th:text="#{msg.userProfile.field.locale}"></label><input id="locale" type="text" th:field="*{locale}" class="form-control" maxlength="10" placeholder="es_ES, en_GB, ..."><div class="text-danger" th:if="${#fields.hasErrors('locale')}" th:errors="*{locale}"></div></div>
<div class="mb-3"><label for="profileImageFile" class="form-label" th:text="#{msg.userProfile.field.profileImageUpload}"></label><input id="profileImageFile" type="file" name="profileImageFile" accept="image/png,image/jpeg,image/gif" class="form-control"><small class="text-muted" th:text="#{msg.userProfile.field.profileImageUpload.help}"></small></div>
<button type="submit" class="btn btn-primary" th:text="#{msg.userProfile.action.save}"></button><a class="btn btn-secondary ms-2" th:href="@{/}" th:text="#{msg.userProfile.action.back}"></a>
</form></div></main></body></html>
