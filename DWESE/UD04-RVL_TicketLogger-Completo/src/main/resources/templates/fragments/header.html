<header class="border-bottom bg-light" th:fragment="header" xmlns:th="http://www.thymeleaf.org">
  <nav class="navbar navbar-expand-lg">
    <div class="container-fluid">
      <a class="navbar-brand d-flex align-items-center" th:href="@{/}">
        <img th:src="@{/images/logo.svg}" alt="Ticket Logger" width="40" height="32" class="me-2">
        <span class="fw-semibold text-primary">Ticket Logger</span>
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarMenu" aria-controls="navbarMenu" aria-expanded="false" aria-label="Toggle navigation"><span class="navbar-toggler-icon"></span></button>
      <div class="collapse navbar-collapse" id="navbarMenu">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
          <li class="nav-item"><a class="nav-link" th:href="@{/}" th:text="#{msg.nav.home}">Inicio</a></li>
          <li class="nav-item"><a class="nav-link" th:href="@{/users}" th:text="#{msg.users}">Usuarios</a></li>
          <li class="nav-item"><a class="nav-link" th:href="@{/roles}" th:text="#{msg.roles}">Roles</a></li>
        </ul>
        <form method="get" class="d-lg-flex align-items-center me-3" th:action="@{/}">
          <label for="langSelect" class="visually-hidden" th:text="#{msg.nav.language}">Idioma</label>
          <select id="langSelect" name="lang" class="form-select form-select-sm" onchange="this.form.submit()" aria-label="Language">
            <option value="es" th:selected="${#locale.language == 'es'}">Español</option>
            <option value="en" th:selected="${#locale.language == 'en'}">English</option>
          </select>
        </form>
        <div class="dropdown text-end">
          <a href="#" class="d-block link-body-emphasis text-decoration-none dropdown-toggle" th:aria-label="#{msg.myProfile}" data-bs-toggle="dropdown" aria-expanded="false">
            <img th:src="@{${navProfileImage}}" alt="avatar" width="40" height="40" class="rounded-circle border border-2 border-primary-subtle">
          </a>
          <ul class="dropdown-menu dropdown-menu-end text-small shadow">
            <li><a class="dropdown-item" th:href="@{/profile/edit}" th:text="#{msg.nav.profile}">Editar perfil</a></li>
          </ul>
        </div>
      </div>
    </div>
  </nav>
</header>
